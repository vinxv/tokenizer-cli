name: Build Binaries

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86-64 gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use-cross: false

          # Linux x86-64 musl
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use-cross: true

          # Linux arm64 gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use-cross: true

          # Linux arm64 musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            use-cross: true

          # macOS x86-64 (Intel)
          - os: macos-13
            target: x86_64-apple-darwin
            use-cross: false

          # macOS arm64 (Apple Silicon)
          - os: macos-latest
            target: aarch64-apple-darwin
            use-cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup cache
        uses: Swatinem/rust-cache@v2

      - name: Install cross
        if: matrix.use-cross
        uses: taiki-e/install-action@cross

      - name: Build binary
        run: |
          if [ "${{ matrix.use-cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Archive binary
        run: |
          mv target/${{ matrix.target }}/release/tokenizer-cli target/tokenizer-cli-${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tokenizer-cli-${{ matrix.target }}
          path: target/tokenizer-cli-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7
