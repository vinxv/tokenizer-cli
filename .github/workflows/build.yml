name: Build Binaries

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86-64 gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

          # Linux x86-64 musl
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl

          # Linux arm64 gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu

          # Linux arm64 musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl

          # macOS x86-64 (Intel)
          - os: macos-latest
            target: x86_64-apple-darwin

          # macOS arm64 (Apple Silicon)
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu
          pip3 install cargo-zigbuild

      - name: Build binary
        run: |
          if [[ "${{ matrix.target }}" == *"linux"* ]]; then
            # Use zigbuild for Linux to handle cross-compilation and musl seamlessly
            cargo zigbuild --release --target ${{ matrix.target }}
          else
            # Native cargo build for macOS
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Archive binary
        run: |
          mkdir -p dist
          if [[ "${{ matrix.target }}" == *"linux"* ]]; then
            cp target/${{ matrix.target }}/release/tokenizer-cli dist/tokenizer-cli-${{ matrix.target }}
          else
            cp target/release/tokenizer-cli dist/tokenizer-cli-${{ matrix.target }} || cp target/${{ matrix.target }}/release/tokenizer-cli dist/tokenizer-cli-${{ matrix.target }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tokenizer-cli-${{ matrix.target }}
          path: dist/tokenizer-cli-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
