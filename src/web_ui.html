<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Tokenizer Dashboard</title>
        <style>
            :root {
                --bg-base: #050505;
                --bg-panel: #111111;
                --bg-card: #18181b;
                --border: #27272a;
                --border-hover: #3f3f46;
                --text-main: #f4f4f5;
                --text-muted: #a1a1aa;
                --accent: #00ffb2;
                --accent-dim: rgba(0, 255, 178, 0.1);
                --err: #ef4444;
                --err-dim: rgba(239, 68, 68, 0.1);
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    "Helvetica Neue", Arial, sans-serif;
                background-color: var(--bg-base);
                color: var(--text-main);
                line-height: 1.5;
                display: flex;
                justify-content: center;
                min-height: 100vh;
                padding: 2rem;
                background-image:
                    radial-gradient(
                        circle at 50% 0%,
                        var(--bg-panel) 0%,
                        transparent 50%
                    ),
                    linear-gradient(to bottom, transparent, var(--bg-base));
            }

            .container {
                width: 100%;
                max-width: 900px;
                display: flex;
                flex-direction: column;
                gap: 2rem;
                animation: fade-in 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            }

            @keyframes fade-in {
                from {
                    opacity: 0;
                    transform: translateY(10px);
                }

                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            header {
                display: flex;
                justify-content: space-between;
                align-items: flex-end;
                padding-bottom: 1.5rem;
                border-bottom: 1px solid var(--border);
            }

            h1 {
                font-size: 1.5rem;
                font-weight: 600;
                letter-spacing: -0.02em;
            }

            .subtitle {
                color: var(--text-muted);
                font-size: 0.875rem;
                margin-top: 0.25rem;
            }

            .control-group {
                display: flex;
                flex-direction: column;
                gap: 0.5rem;
                width: 300px;
            }

            label {
                font-size: 0.75rem;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: var(--text-muted);
                font-weight: 500;
            }

            select,
            input,
            textarea {
                background-color: var(--bg-card);
                border: 1px solid var(--border);
                color: var(--text-main);
                border-radius: 6px;
                padding: 0.75rem 1rem;
                font-family: inherit;
                font-size: 0.875rem;
                transition: all 0.2s ease;
                outline: none;
                width: 100%;
            }

            select:focus,
            input:focus,
            textarea:focus {
                border-color: var(--text-muted);
                box-shadow: 0 0 0 1px var(--text-muted);
            }

            textarea {
                resize: vertical;
                min-height: 120px;
                font-family: inherit;
            }

            .tabs {
                display: flex;
                gap: 1rem;
                border-bottom: 1px solid var(--border);
                margin-bottom: 1.5rem;
            }

            .tab {
                padding: 0.75rem 0;
                color: var(--text-muted);
                background: none;
                border: none;
                border-bottom: 2px solid transparent;
                font-size: 0.875rem;
                font-weight: 500;
                cursor: pointer;
                transition: all 0.2s ease;
                margin-bottom: -1px;
            }

            .tab:hover {
                color: var(--text-main);
            }

            .tab.active {
                color: var(--accent);
                border-bottom-color: var(--accent);
            }

            .panel {
                display: none;
                background: var(--bg-panel);
                border: 1px solid var(--border);
                border-radius: 8px;
                padding: 1.5rem;
            }

            .panel.active {
                display: flex;
                flex-direction: column;
                gap: 1rem;
            }

            button.action {
                background-color: var(--text-main);
                color: var(--bg-base);
                border: none;
                padding: 0.75rem 1.5rem;
                border-radius: 6px;
                font-weight: 500;
                font-size: 0.875rem;
                cursor: pointer;
                transition:
                    transform 0.1s ease,
                    background-color 0.2s ease;
                align-self: flex-start;
            }

            button.action:hover {
                background-color: #fff;
            }

            button.action:active {
                transform: scale(0.98);
            }

            .result-box {
                margin-top: 1rem;
                padding: 1.25rem;
                background-color: var(--bg-card);
                border: 1px solid var(--border);
                border-radius: 6px;
                font-family:
                    ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
                    "Liberation Mono", "Courier New", monospace;
                font-size: 0.875rem;
                min-height: 60px;
                color: var(--text-muted);
                word-break: break-all;
                display: flex;
                flex-wrap: wrap;
                gap: 0.25rem;
            }

            .result-box.success {
                color: var(--accent);
                border-color: var(--accent-dim);
                background-color: rgba(0, 255, 178, 0.02);
            }

            .result-box.error {
                color: var(--err);
                border-color: var(--err-dim);
                background-color: rgba(239, 68, 68, 0.02);
            }

            .token-chip {
                background-color: var(--border);
                color: var(--text-main);
                padding: 2px 6px;
                border-radius: 4px;
                font-size: 0.75rem;
                display: inline-block;
            }

            .result-header {
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
                gap: 1rem;
                width: 100%;
                flex: 0 0 100%;
                padding: 0.75rem 0 1rem 0;
                margin-bottom: 1rem;
                border-bottom: 2px solid var(--accent-dim);
            }

            .result-header-info {
                display: flex;
                flex-direction: column;
                gap: 0.25rem;
                min-width: 0;
            }

            .token-count-label {
                font-size: 0.75rem;
                text-transform: uppercase;
                letter-spacing: 0.08em;
                color: var(--text-muted);
            }

            .token-count {
                font-size: 1.5rem;
                font-weight: 600;
                color: var(--accent);
                letter-spacing: -0.02em;
                line-height: 1.1;
            }

            .result-meta {
                display: flex;
                flex-wrap: wrap;
                gap: 0.75rem;
                width: 100%;
                margin-top: 0.25rem;
            }

            .result-meta-item {
                display: inline-flex;
                align-items: baseline;
                gap: 0.35rem;
                min-width: 0;
            }

            .result-meta-label {
                font-size: 0.72rem;
                text-transform: uppercase;
                letter-spacing: 0.08em;
                color: var(--text-muted);
            }

            .result-meta-value {
                font-size: 0.82rem;
                font-weight: 600;
                color: var(--text-main);
            }

            button.copy-btn {
                background-color: var(--accent);
                color: var(--bg-base);
                border: none;
                padding: 0.625rem 1.25rem;
                border-radius: 6px;
                font-weight: 600;
                font-size: 0.875rem;
                cursor: pointer;
                transition:
                    transform 0.1s ease,
                    background-color 0.2s ease,
                    box-shadow 0.2s ease;
                box-shadow: 0 2px 8px rgba(0, 255, 178, 0.2);
                flex-shrink: 0;
            }

            button.copy-btn:hover {
                background-color: #00d98e;
                box-shadow: 0 4px 12px rgba(0, 255, 178, 0.35);
            }

            button.copy-btn:active {
                transform: scale(0.96);
            }

            button.copy-btn.copied {
                background-color: var(--text-main);
                color: var(--bg-card);
                box-shadow: 0 2px 8px rgba(244, 244, 245, 0.2);
            }

            .count-display {
                font-size: 2rem;
                font-weight: 600;
                color: var(--text-main);
                letter-spacing: -0.05em;
            }

            .count-result-content {
                display: flex;
                align-items: baseline;
                gap: 0.5rem;
                width: 100%;
            }

            .count-unit {
                font-size: 0.78rem;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.08em;
                color: var(--text-muted);
            }

            .token-list {
                display: flex;
                flex-wrap: wrap;
                gap: 0.25rem;
                width: 100%;
            }

            .text-result {
                display: block;
                color: var(--text-main);
                font-family: inherit;
                line-height: 1.7;
                white-space: pre-wrap;
                word-break: break-word;
                width: 100%;
            }

            .error-message {
                width: 100%;
            }

            .loader {
                border: 2px solid var(--border);
                border-top: 2px solid var(--accent);
                border-radius: 50%;
                width: 16px;
                height: 16px;
                animation: spin 1s linear infinite;
                display: inline-block;
                vertical-align: middle;
                margin-right: 8px;
            }

            @keyframes spin {
                0% {
                    transform: rotate(0deg);
                }

                100% {
                    transform: rotate(360deg);
                }
            }

            @media (max-width: 640px) {
                body {
                    padding: 1rem;
                }

                header {
                    flex-direction: column;
                    align-items: stretch;
                    gap: 1rem;
                }

                .control-group {
                    width: 100%;
                }

                .tabs {
                    gap: 0.75rem;
                    overflow-x: auto;
                }

                .result-header {
                    flex-direction: column;
                    align-items: stretch;
                }

                button.copy-btn {
                    width: 100%;
                }
            }
        </style>
    </head>

    <body>
        <div class="container">
            <header>
                <div>
                    <h1>Tokenizer Dashboard</h1>
                    <div class="subtitle">
                        Real-time interaction with the tokenization
                        microservice.
                    </div>
                </div>
                <div class="control-group">
                    <label for="modelSelect">Active Model</label>
                    <select id="modelSelect">
                        <option value="">Loading models...</option>
                    </select>
                </div>
            </header>

            <main>
                <div class="tabs">
                    <button class="tab active" data-target="encode-panel">
                        Encode
                    </button>
                    <button class="tab" data-target="decode-panel">
                        Decode
                    </button>
                    <button class="tab" data-target="count-panel">Count</button>
                </div>

                <!-- Encode Panel -->
                <div id="encode-panel" class="panel active">
                    <div class="control-group" style="width: 100%">
                        <label for="encode-input">Input Text</label>
                        <textarea
                            id="encode-input"
                            placeholder="Type or paste text here..."
                        ></textarea>
                    </div>
                    <button class="action" onclick="handleEncode()">
                        Encode
                    </button>
                    <div class="result-box" id="encode-result">
                        Results will appear here.
                    </div>
                </div>

                <!-- Decode Panel -->
                <div id="decode-panel" class="panel">
                    <div class="control-group" style="width: 100%">
                        <label for="decode-input">Token IDs</label>
                        <textarea
                            id="decode-input"
                            placeholder="e.g. 101, 2023, 102 or [101, 2023, 102]"
                            style="
                                font-family:
                                    ui-monospace, SFMono-Regular, Menlo, Monaco,
                                    Consolas, monospace;
                            "
                        ></textarea>
                    </div>
                    <button class="action" onclick="handleDecode()">
                        Decode
                    </button>
                    <div class="result-box" id="decode-result">
                        Results will appear here.
                    </div>
                </div>

                <!-- Count Panel -->
                <div id="count-panel" class="panel">
                    <div class="control-group" style="width: 100%">
                        <label for="count-input">Input Text</label>
                        <textarea
                            id="count-input"
                            placeholder="Type or paste text here..."
                        ></textarea>
                    </div>
                    <button class="action" onclick="handleCount()">
                        Count Tokens
                    </button>
                    <div class="result-box" id="count-result">
                        Results will appear here.
                    </div>
                </div>
            </main>
        </div>

        <script>
            // --- State ---
            let currentModel = "";

            // --- Init ---
            async function fetchModels() {
                try {
                    const res = await fetch("/v1/models");
                    if (!res.ok) throw new Error("Failed to fetch models");
                    const data = await res.json();

                    const select = document.getElementById("modelSelect");
                    select.innerHTML = "";

                    if (data.models && data.models.length > 0) {
                        data.models.forEach((m) => {
                            const opt = document.createElement("option");
                            opt.value = m.model_id;
                            opt.textContent = `${m.model_id}`;
                            select.appendChild(opt);
                        });
                        currentModel = select.value;
                    } else {
                        select.innerHTML =
                            '<option value="">No models loaded</option>';
                    }
                } catch (err) {
                    console.error(err);
                    document.getElementById("modelSelect").innerHTML =
                        `<option value="">Error loading models. Ensure service is running.</option>`;
                }
            }

            document
                .getElementById("modelSelect")
                .addEventListener("change", (e) => {
                    currentModel = e.target.value;
                });

            // --- Tabs ---
            document.querySelectorAll(".tab").forEach((tab) => {
                tab.addEventListener("click", () => {
                    document
                        .querySelectorAll(".tab")
                        .forEach((t) => t.classList.remove("active"));
                    document
                        .querySelectorAll(".panel")
                        .forEach((p) => p.classList.remove("active"));

                    tab.classList.add("active");
                    document
                        .getElementById(tab.dataset.target)
                        .classList.add("active");
                });
            });

            // --- API Calls ---
            function renderLoading(containerId) {
                const el = document.getElementById(containerId);
                el.className = "result-box";
                el.innerHTML = '<div class="loader"></div> Processing...';
            }

            function nowMs() {
                if (
                    typeof performance !== "undefined" &&
                    typeof performance.now === "function"
                ) {
                    return performance.now();
                }
                return Date.now();
            }

            function formatElapsedMs(elapsedMs) {
                const safeElapsedMs = Math.max(elapsedMs, 0);
                if (safeElapsedMs < 10) {
                    return `${safeElapsedMs.toFixed(1)} ms`;
                }
                if (safeElapsedMs < 1000) {
                    return `${Math.round(safeElapsedMs)} ms`;
                }
                return `${(safeElapsedMs / 1000).toFixed(2)} s`;
            }

            function createMetaRow(items) {
                const row = document.createElement("div");
                row.className = "result-meta";

                items.forEach((item) => {
                    const metaItem = document.createElement("div");
                    metaItem.className = "result-meta-item";

                    const label = document.createElement("span");
                    label.className = "result-meta-label";
                    label.textContent = item.label;

                    const value = document.createElement("span");
                    value.className = "result-meta-value";
                    value.textContent = item.value;

                    metaItem.appendChild(label);
                    metaItem.appendChild(value);
                    row.appendChild(metaItem);
                });

                return row;
            }

            async function timedJsonFetch(url, options) {
                const startedAt = nowMs();
                try {
                    const res = await fetch(url, options);
                    const data = await res.json();
                    return {
                        res,
                        data,
                        elapsedMs: nowMs() - startedAt,
                    };
                } catch (err) {
                    if (err && typeof err === "object") {
                        err.elapsedMs = nowMs() - startedAt;
                    }
                    throw err;
                }
            }

            function renderError(containerId, err, elapsedMs) {
                const el = document.getElementById(containerId);
                el.className = "result-box error";
                if (typeof elapsedMs !== "number") {
                    el.textContent = err.message || err;
                    return;
                }

                el.innerHTML = "";
                el.appendChild(
                    createMetaRow([
                        {
                            label: "Request Time",
                            value: formatElapsedMs(elapsedMs),
                        },
                    ]),
                );

                const message = document.createElement("div");
                message.className = "error-message";
                message.textContent = err.message || err;
                el.appendChild(message);
            }

            function normalizeTokenId(value, position) {
                const token = String(value).trim();
                if (!/^\d+$/.test(token)) {
                    throw new Error(
                        `Invalid token ID at position ${position}: ${token}`,
                    );
                }

                const id = Number.parseInt(token, 10);
                if (!Number.isSafeInteger(id) || id < 0) {
                    throw new Error(
                        `Invalid token ID at position ${position}: ${token}`,
                    );
                }

                return id;
            }

            function parseTokenIds(raw) {
                const trimmed = raw.trim();
                if (!trimmed) return [];

                let normalized = trimmed
                    .replace(/[［【]/g, "[")
                    .replace(/[］】]/g, "]")
                    .replace(/[，、；;]/g, ",");

                if (normalized.startsWith("[") && normalized.endsWith("]")) {
                    try {
                        const parsed = JSON.parse(normalized);
                        if (!Array.isArray(parsed)) {
                            throw new Error("Token IDs must be a JSON array.");
                        }
                        return parsed.map((value, index) =>
                            normalizeTokenId(value, index + 1),
                        );
                    } catch (err) {
                        const inner = normalized.slice(1, -1).trim();
                        if (!inner) return [];
                        normalized = inner;
                    }
                }

                const parts = normalized
                    .split(/[\s,]+/)
                    .map((part) => part.trim())
                    .filter((part) => part !== "");

                return parts.map((part, index) =>
                    normalizeTokenId(part, index + 1),
                );
            }

            function renderDecodedText(containerId, text, elapsedMs) {
                const el = document.getElementById(containerId);
                el.className = "result-box success";
                el.innerHTML = "";
                el.appendChild(
                    createMetaRow([
                        {
                            label: "Request Time",
                            value: formatElapsedMs(elapsedMs),
                        },
                    ]),
                );

                const content = document.createElement("div");
                content.className = "text-result";
                content.textContent = text;
                el.appendChild(content);
            }

            function renderCountResult(containerId, count, elapsedMs) {
                const el = document.getElementById(containerId);
                el.className = "result-box success";
                el.innerHTML = "";
                el.appendChild(
                    createMetaRow([
                        {
                            label: "Request Time",
                            value: formatElapsedMs(elapsedMs),
                        },
                    ]),
                );

                const content = document.createElement("div");
                content.className = "count-result-content";

                const countDisplay = document.createElement("span");
                countDisplay.className = "count-display";
                countDisplay.textContent = `${count}`;

                const countUnit = document.createElement("span");
                countUnit.className = "count-unit";
                countUnit.textContent = count === 1 ? "token" : "tokens";

                content.appendChild(countDisplay);
                content.appendChild(countUnit);
                el.appendChild(content);
            }

            async function handleEncode() {
                const text = document.getElementById("encode-input").value;
                if (!text || !currentModel) return;

                renderLoading("encode-result");
                try {
                    const { res, data, elapsedMs } = await timedJsonFetch(
                        "/v1/token/encode",
                        {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ model: currentModel, text }),
                        },
                    );
                    if (!res.ok) {
                        const err = new Error(data.error || "Encode failed");
                        err.elapsedMs = elapsedMs;
                        throw err;
                    }

                    const el = document.getElementById("encode-result");
                    el.className = "result-box success";
                    el.innerHTML = "";

                    // Header with token count and copy button
                    const header = document.createElement("div");
                    header.className = "result-header";

                    const headerInfo = document.createElement("div");
                    headerInfo.className = "result-header-info";

                    const countLabel = document.createElement("span");
                    countLabel.className = "token-count-label";
                    countLabel.textContent = "Token Count";

                    const countInfo = document.createElement("span");
                    countInfo.className = "token-count";
                    countInfo.textContent = `${data.ids.length}`;

                    headerInfo.appendChild(countLabel);
                    headerInfo.appendChild(countInfo);
                    headerInfo.appendChild(
                        createMetaRow([
                            {
                                label: "Request Time",
                                value: formatElapsedMs(elapsedMs),
                            },
                        ]),
                    );

                    const copyBtn = document.createElement("button");
                    copyBtn.className = "copy-btn";
                    copyBtn.textContent = "Copy";
                    copyBtn.onclick = (e) => {
                        e.stopPropagation();
                        const tokenStr = data.ids.join(", ");
                        navigator.clipboard.writeText(tokenStr).then(() => {
                            const originalText = copyBtn.textContent;
                            copyBtn.textContent = "Copied!";
                            copyBtn.classList.add("copied");
                            setTimeout(() => {
                                copyBtn.textContent = originalText;
                                copyBtn.classList.remove("copied");
                            }, 2000);
                        }).catch(() => {
                            alert("Failed to copy");
                        });
                    };

                    header.appendChild(headerInfo);
                    header.appendChild(copyBtn);
                    el.appendChild(header);

                    // Token chips container
                    const chipsContainer = document.createElement("div");
                    chipsContainer.className = "token-list";

                    data.ids.forEach((id) => {
                        const span = document.createElement("span");
                        span.className = "token-chip";
                        span.textContent = id;
                        chipsContainer.appendChild(span);
                    });

                    el.appendChild(chipsContainer);
                } catch (err) {
                    renderError("encode-result", err, err.elapsedMs);
                }
            }

            async function handleDecode() {
                const raw = document.getElementById("decode-input").value;
                if (!raw || !currentModel) return;

                let ids;
                try {
                    ids = parseTokenIds(raw);
                } catch (err) {
                    return renderError("decode-result", err);
                }

                if (ids.length === 0)
                    return renderError(
                        "decode-result",
                        "Please enter valid numbers",
                    );

                renderLoading("decode-result");
                try {
                    const { res, data, elapsedMs } = await timedJsonFetch(
                        "/v1/token/decode",
                        {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ model: currentModel, ids }),
                        },
                    );

                    if (!res.ok) {
                        const err = new Error(data.error || "Decode failed");
                        err.elapsedMs = elapsedMs;
                        throw err;
                    }

                    renderDecodedText("decode-result", data.text, elapsedMs);
                } catch (err) {
                    renderError("decode-result", err, err.elapsedMs);
                }
            }

            async function handleCount() {
                const text = document.getElementById("count-input").value;
                if (!text || !currentModel) return;

                renderLoading("count-result");
                try {
                    const { res, data, elapsedMs } = await timedJsonFetch(
                        "/v1/token/count",
                        {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ model: currentModel, text }),
                        },
                    );

                    if (!res.ok) {
                        const err = new Error(data.error || "Count failed");
                        err.elapsedMs = elapsedMs;
                        throw err;
                    }

                    renderCountResult("count-result", data.count, elapsedMs);
                } catch (err) {
                    renderError("count-result", err, err.elapsedMs);
                }
            }

            // Initialize
            document.addEventListener("DOMContentLoaded", fetchModels);
        </script>
    </body>
</html>
