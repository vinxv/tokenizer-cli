<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="dark" />
        <meta name="theme-color" content="#0c0a09" />
        <title>Tokenizer Dashboard</title>
        <style>
            @font-face {
                font-family: "IBM Plex Sans";
                font-style: normal;
                font-weight: 300;
                font-display: swap;
                src: url("/fonts/ibm-plex-sans-300.woff2") format("woff2");
            }

            @font-face {
                font-family: "IBM Plex Sans";
                font-style: normal;
                font-weight: 400;
                font-display: swap;
                src: url("/fonts/ibm-plex-sans-400.woff2") format("woff2");
            }

            @font-face {
                font-family: "IBM Plex Sans";
                font-style: normal;
                font-weight: 500;
                font-display: swap;
                src: url("/fonts/ibm-plex-sans-500.woff2") format("woff2");
            }

            @font-face {
                font-family: "IBM Plex Mono";
                font-style: normal;
                font-weight: 400;
                font-display: swap;
                src: url("/fonts/ibm-plex-mono-400.woff2") format("woff2");
            }

            @font-face {
                font-family: "IBM Plex Mono";
                font-style: normal;
                font-weight: 500;
                font-display: swap;
                src: url("/fonts/ibm-plex-mono-500.woff2") format("woff2");
            }

            :root {
                --bg-base: #0c0a09;
                --bg-panel: var(--bg-base);
                --bg-card: var(--bg-base);
                --border: #292524;
                --border-strong: #44403c;
                --text-main: #e7e5e4;
                --text-muted: #a8a29e;
                --accent: #58a6ff;
                --accent-dim: rgba(88, 166, 255, 0.14);
                --err: #f85149;
                --err-dim: rgba(248, 81, 73, 0.14);
                --font-sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont,
                    "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
                --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono",
                    SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono",
                    monospace;
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            html {
                color-scheme: dark;
            }

            body {
                font-family: var(--font-sans);
                background-color: var(--bg-base);
                color: var(--text-main);
                line-height: 1.5;
                display: flex;
                justify-content: center;
                min-height: 100vh;
                padding: 3rem 2rem;
                font-variant-numeric: tabular-nums;
                -webkit-font-smoothing: antialiased;
            }

            .container {
                width: 100%;
                max-width: 880px;
                display: flex;
                flex-direction: column;
                gap: 2.5rem;
            }

            header {
                display: flex;
                justify-content: space-between;
                align-items: flex-end;
                gap: 2rem;
                padding-bottom: 1.75rem;
                border-bottom: 1px solid var(--border-strong);
            }

            h1 {
                font-size: 1.625rem;
                font-weight: 400;
                letter-spacing: -0.02em;
                line-height: 1.15;
            }

            .subtitle {
                color: var(--text-muted);
                font-size: 0.8125rem;
                margin-top: 0.5rem;
                max-width: 44ch;
                line-height: 1.5;
            }

            .control-group {
                display: flex;
                flex-direction: column;
                gap: 0.5rem;
                width: 280px;
                flex-shrink: 0;
            }

            label {
                font-size: 0.6875rem;
                text-transform: uppercase;
                letter-spacing: 0.1em;
                color: var(--text-muted);
                font-weight: 500;
            }

            select,
            input,
            textarea {
                background-color: var(--bg-card);
                border: 1px solid var(--border-strong);
                color: var(--text-main);
                border-radius: 0;
                padding: 0.625rem 0.75rem;
                font-family: inherit;
                font-size: 0.875rem;
                transition: border-color 0.15s ease;
                outline: none;
                width: 100%;
            }

            select:focus-visible,
            input:focus-visible,
            textarea:focus-visible {
                border-color: var(--accent);
                box-shadow: inset 0 0 0 1px var(--accent);
            }

            textarea {
                resize: vertical;
                min-height: 120px;
                font-family: inherit;
            }

            .tabs {
                display: flex;
                border-bottom: 1px solid var(--border-strong);
            }

            .tab {
                padding: 0.875rem 0;
                margin-right: 2rem;
                color: var(--text-muted);
                background: none;
                border: none;
                border-bottom: 2px solid transparent;
                font-size: 0.75rem;
                font-weight: 500;
                text-transform: uppercase;
                letter-spacing: 0.1em;
                cursor: pointer;
                transition: color 0.15s ease;
                margin-bottom: -1px;
            }

            .tab:hover {
                color: var(--text-main);
            }

            .tab.active {
                color: var(--text-main);
                border-bottom-color: var(--accent);
            }

            .tab[hidden],
            .panel[hidden] {
                display: none !important;
            }

            .panel {
                display: none;
                background: var(--bg-panel);
                border: 1px solid var(--border);
                border-radius: 0;
                padding: 1.75rem;
            }

            .panel.active {
                display: flex;
                flex-direction: column;
                gap: 1.25rem;
            }

            button.action {
                background-color: var(--text-main);
                color: var(--bg-base);
                border: 1px solid var(--text-main);
                padding: 0.6875rem 1.5rem;
                border-radius: 0;
                font-weight: 500;
                font-size: 0.75rem;
                text-transform: uppercase;
                letter-spacing: 0.08em;
                cursor: pointer;
                transition: background-color 0.15s ease, border-color 0.15s ease;
                align-self: flex-start;
            }

            button.action:hover {
                background-color: #f0f6fc;
                border-color: #f0f6fc;
            }

            button.action:active {
                background-color: var(--accent);
                border-color: var(--accent);
                color: var(--bg-base);
            }

            .result-box {
                margin-top: 0.25rem;
                padding: 1.25rem;
                background-color: transparent;
                border: 1px solid var(--border);
                border-radius: 0;
                font-family: var(--font-mono);
                font-size: 0.8125rem;
                min-height: 60px;
                color: var(--text-muted);
                word-break: break-all;
                display: flex;
                flex-wrap: wrap;
                gap: 0.25rem;
            }

            .result-box.success {
                color: var(--text-main);
                border-color: var(--border);
                border-left: 2px solid var(--accent);
            }

            .result-box.error {
                color: var(--err);
                border-color: var(--border);
                border-left: 2px solid var(--err);
            }

            .token-chip {
                background-color: var(--bg-card);
                color: var(--text-main);
                padding: 1px 6px;
                border: 1px solid var(--border-strong);
                border-radius: 0;
                font-size: 0.75rem;
                display: inline-block;
            }

            .result-header {
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
                gap: 1rem;
                width: 100%;
                flex: 0 0 100%;
                padding: 0 0 1rem 0;
                margin-bottom: 1.25rem;
                border-bottom: 1px solid var(--border);
            }

            .result-header-info {
                display: flex;
                flex-direction: column;
                gap: 0.375rem;
                min-width: 0;
            }

            .token-count-label {
                font-size: 0.6875rem;
                text-transform: uppercase;
                letter-spacing: 0.1em;
                color: var(--text-muted);
                font-weight: 500;
            }

            .token-count {
                font-size: 1.625rem;
                font-weight: 400;
                color: var(--accent);
                letter-spacing: -0.02em;
                line-height: 1.1;
            }

            .result-meta {
                display: flex;
                flex-wrap: wrap;
                gap: 1.5rem;
                width: 100%;
                margin-top: 0.25rem;
            }

            .result-meta-item {
                display: inline-flex;
                align-items: baseline;
                gap: 0.5rem;
                min-width: 0;
            }

            .result-meta-label {
                font-size: 0.6875rem;
                text-transform: uppercase;
                letter-spacing: 0.1em;
                color: var(--text-muted);
                font-weight: 500;
            }

            .result-meta-value {
                font-size: 0.8125rem;
                font-weight: 500;
                color: var(--text-main);
            }

            button.copy-btn {
                background-color: transparent;
                color: var(--accent);
                border: 1px solid var(--accent);
                padding: 0.5rem 1rem;
                border-radius: 0;
                font-weight: 500;
                font-size: 0.6875rem;
                text-transform: uppercase;
                letter-spacing: 0.1em;
                cursor: pointer;
                transition: background-color 0.15s ease, color 0.15s ease;
                flex-shrink: 0;
            }

            button.copy-btn:hover {
                background-color: var(--accent);
                color: var(--bg-base);
            }

            button.copy-btn:active {
                background-color: var(--accent-dim);
                color: var(--accent);
            }

            button.copy-btn.copied {
                background-color: var(--text-main);
                color: var(--bg-base);
                border-color: var(--text-main);
            }

            .count-display {
                font-size: 2.25rem;
                font-weight: 300;
                color: var(--text-main);
                letter-spacing: -0.03em;
                line-height: 1;
            }

            .count-result-content {
                display: flex;
                align-items: baseline;
                gap: 0.625rem;
                width: 100%;
            }

            .count-unit {
                font-size: 0.6875rem;
                font-weight: 500;
                text-transform: uppercase;
                letter-spacing: 0.1em;
                color: var(--text-muted);
            }

            .token-list {
                display: flex;
                flex-wrap: wrap;
                gap: 0.25rem;
                width: 100%;
            }

            .text-result {
                display: block;
                color: var(--text-main);
                font-family: inherit;
                line-height: 1.7;
                white-space: pre-wrap;
                word-break: break-word;
                width: 100%;
            }

            .section-label {
                width: 100%;
                font-family: var(--font-sans);
                font-size: 0.6875rem;
                font-weight: 500;
                letter-spacing: 0.1em;
                text-transform: uppercase;
                color: var(--text-muted);
                margin-top: 1.25rem;
                padding-bottom: 0.5rem;
                border-bottom: 1px solid var(--border);
            }

            .rendered-code {
                display: block;
                width: 100%;
                white-space: pre-wrap;
                word-break: break-word;
                color: var(--text-main);
                background-color: transparent;
                border: 1px solid var(--border);
                border-left: 2px solid var(--border-strong);
                border-radius: 0;
                padding: 1rem 1.25rem;
                line-height: 1.65;
                font-family: var(--font-mono);
                font-size: 0.8125rem;
            }

            .token-table-wrapper {
                width: 100%;
                overflow: auto;
                max-height: 360px;
                border: 1px solid var(--border);
                border-radius: 0;
                background-color: transparent;
                contain: content;
            }

            .token-table {
                width: 100%;
                border-collapse: collapse;
                table-layout: fixed;
                color: var(--text-main);
                font-family: var(--font-mono);
                font-size: 0.8125rem;
            }

            .token-table th,
            .token-table td {
                padding: 0.5rem 0.75rem;
                border-bottom: 1px solid var(--border);
                text-align: left;
                white-space: nowrap;
                height: 34px;
                line-height: 1.25;
            }

            .token-table th {
                position: sticky;
                top: 0;
                background-color: var(--bg-base);
                color: var(--text-muted);
                font-size: 0.6875rem;
                font-weight: 500;
                letter-spacing: 0.1em;
                text-transform: uppercase;
                border-bottom: 1px solid var(--border-strong);
            }

            .token-table tr:last-child td {
                border-bottom: none;
            }

            .token-table-index {
                color: var(--text-muted);
                width: 5rem;
            }

            .token-table-id {
                width: 7rem;
            }

            .token-table-text {
                white-space: pre;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .token-table-empty {
                color: var(--text-muted);
                font-style: italic;
            }

            .token-table-spacer td {
                padding: 0;
                border-bottom: none;
                height: 0;
            }

            .error-message {
                width: 100%;
            }

            .loader {
                border: 1px solid var(--border-strong);
                border-top: 1px solid var(--accent);
                border-radius: 50%;
                width: 14px;
                height: 14px;
                animation: spin 0.8s linear infinite;
                display: inline-block;
                vertical-align: middle;
                margin-right: 8px;
            }

            @keyframes spin {
                0% {
                    transform: rotate(0deg);
                }

                100% {
                    transform: rotate(360deg);
                }
            }

            @media (prefers-reduced-motion: reduce) {
                .loader {
                    animation: none;
                }

                *,
                *::before,
                *::after {
                    transition: none !important;
                }
            }

            @media (max-width: 640px) {
                body {
                    padding: 1.5rem 1rem;
                }

                header {
                    flex-direction: column;
                    align-items: stretch;
                    gap: 1.5rem;
                }

                .control-group {
                    width: 100%;
                }

                .tabs {
                    overflow-x: auto;
                }

                .tab {
                    margin-right: 1.5rem;
                }

                .result-header {
                    flex-direction: column;
                    align-items: stretch;
                }

                button.copy-btn {
                    width: 100%;
                }
            }
        </style>
    </head>

    <body>
        <div class="container">
            <header>
                <div>
                    <h1>Tokenizer Dashboard</h1>
                    <div class="subtitle">
                        Real-time interaction with the tokenization
                        microservice.
                    </div>
                </div>
                <div class="control-group">
                    <label for="modelSelect">Active Model</label>
                    <select id="modelSelect">
                        <option value="">Loading models...</option>
                    </select>
                </div>
            </header>

            <main>
                <div class="tabs">
                    <button class="tab active" data-target="encode-panel">
                        Encode
                    </button>
                    <button class="tab" data-target="decode-panel">
                        Decode
                    </button>
                    <button class="tab" data-target="count-panel">Count</button>
                    <button
                        id="render-tab"
                        class="tab"
                        data-target="render-panel"
                        hidden
                    >
                        Render
                    </button>
                </div>

                <!-- Render Panel -->
                <div id="render-panel" class="panel" hidden>
                    <div class="control-group" style="width: 100%">
                        <label for="render-input">Chat Completions Input</label>
                        <textarea
                            id="render-input"
                            placeholder='{"messages":[{"role":"user","content":"Hello"}]}'
                            style="
                                font-family:
                                    ui-monospace, SFMono-Regular, Menlo, Monaco,
                                    Consolas, monospace;
                            "
                        ></textarea>
                    </div>
                    <button class="action" onclick="handleRender()">
                        Render
                    </button>
                    <div class="result-box" id="render-result">
                        Results will appear here.
                    </div>
                </div>

                <!-- Encode Panel -->
                <div id="encode-panel" class="panel active">
                    <div class="control-group" style="width: 100%">
                        <label for="encode-input">Input Text</label>
                        <textarea
                            id="encode-input"
                            placeholder="Type or paste text here..."
                        ></textarea>
                    </div>
                    <button class="action" onclick="handleEncode()">
                        Encode
                    </button>
                    <div class="result-box" id="encode-result">
                        Results will appear here.
                    </div>
                </div>

                <!-- Decode Panel -->
                <div id="decode-panel" class="panel">
                    <div class="control-group" style="width: 100%">
                        <label for="decode-input">Token IDs</label>
                        <textarea
                            id="decode-input"
                            placeholder="e.g. 101, 2023, 102 or [101, 2023, 102]"
                            style="
                                font-family:
                                    ui-monospace, SFMono-Regular, Menlo, Monaco,
                                    Consolas, monospace;
                            "
                        ></textarea>
                    </div>
                    <button class="action" onclick="handleDecode()">
                        Decode
                    </button>
                    <div class="result-box" id="decode-result">
                        Results will appear here.
                    </div>
                </div>

                <!-- Count Panel -->
                <div id="count-panel" class="panel">
                    <div class="control-group" style="width: 100%">
                        <label for="count-input">Input Text</label>
                        <textarea
                            id="count-input"
                            placeholder="Type or paste text here..."
                        ></textarea>
                    </div>
                    <button class="action" onclick="handleCount()">
                        Count Tokens
                    </button>
                    <div class="result-box" id="count-result">
                        Results will appear here.
                    </div>
                </div>
            </main>
        </div>

        <script>
            // --- State ---
            let currentModel = "";
            let modelsById = new Map();

            // --- Init ---
            async function fetchModels() {
                try {
                    const res = await fetch("/v1/models");
                    if (!res.ok) throw new Error("Failed to fetch models");
                    const data = await res.json();

                    const select = document.getElementById("modelSelect");
                    select.innerHTML = "";
                    modelsById = new Map();

                    if (data.models && data.models.length > 0) {
                        data.models.forEach((m) => {
                            modelsById.set(m.model_id, m);
                            const opt = document.createElement("option");
                            opt.value = m.model_id;
                            opt.textContent = `${m.model_id}`;
                            select.appendChild(opt);
                        });
                        currentModel = select.value;
                    } else {
                        select.innerHTML =
                            '<option value="">No models loaded</option>';
                        currentModel = "";
                    }
                    updateRenderTabVisibility();
                } catch (err) {
                    console.error(err);
                    modelsById = new Map();
                    currentModel = "";
                    document.getElementById("modelSelect").innerHTML =
                        `<option value="">Error loading models. Ensure service is running.</option>`;
                    updateRenderTabVisibility();
                }
            }

            document
                .getElementById("modelSelect")
                .addEventListener("change", (e) => {
                    currentModel = e.target.value;
                    updateRenderTabVisibility();
                });

            // --- Tabs ---
            function activatePanel(target) {
                document
                    .querySelectorAll(".tab")
                    .forEach((t) => t.classList.remove("active"));
                document
                    .querySelectorAll(".panel")
                    .forEach((p) => p.classList.remove("active"));

                const tab = document.querySelector(
                    `.tab[data-target="${target}"]`,
                );
                const panel = document.getElementById(target);

                if (!tab || !panel || tab.hidden || panel.hidden) return;

                tab.classList.add("active");
                panel.classList.add("active");
            }

            function selectedModelInfo() {
                return modelsById.get(currentModel);
            }

            function updateRenderTabVisibility() {
                const model = selectedModelInfo();
                const canRender = Boolean(model && model.has_chat_template);
                const renderTab = document.getElementById("render-tab");
                const renderPanel = document.getElementById("render-panel");

                renderTab.hidden = !canRender;
                renderPanel.hidden = !canRender;

                if (
                    !canRender &&
                    (renderTab.classList.contains("active") ||
                        renderPanel.classList.contains("active"))
                ) {
                    activatePanel("encode-panel");
                }
            }

            document.querySelectorAll(".tab").forEach((tab) => {
                tab.addEventListener("click", () => {
                    activatePanel(tab.dataset.target);
                });
            });

            // --- API Calls ---
            function renderLoading(containerId) {
                const el = document.getElementById(containerId);
                el.className = "result-box";
                el.innerHTML = '<div class="loader"></div> Processing...';
            }

            function nowMs() {
                if (
                    typeof performance !== "undefined" &&
                    typeof performance.now === "function"
                ) {
                    return performance.now();
                }
                return Date.now();
            }

            function formatElapsedMs(elapsedMs) {
                const safeElapsedMs = Math.max(elapsedMs, 0);
                if (safeElapsedMs < 10) {
                    return `${safeElapsedMs.toFixed(1)} ms`;
                }
                if (safeElapsedMs < 1000) {
                    return `${Math.round(safeElapsedMs)} ms`;
                }
                return `${(safeElapsedMs / 1000).toFixed(2)} s`;
            }

            function createMetaRow(items) {
                const row = document.createElement("div");
                row.className = "result-meta";

                items.forEach((item) => {
                    const metaItem = document.createElement("div");
                    metaItem.className = "result-meta-item";

                    const label = document.createElement("span");
                    label.className = "result-meta-label";
                    label.textContent = item.label;

                    const value = document.createElement("span");
                    value.className = "result-meta-value";
                    value.textContent = item.value;

                    metaItem.appendChild(label);
                    metaItem.appendChild(value);
                    row.appendChild(metaItem);
                });

                return row;
            }

            async function timedJsonFetch(url, options) {
                const startedAt = nowMs();
                try {
                    const res = await fetch(url, options);
                    const data = await res.json();
                    return {
                        res,
                        data,
                        elapsedMs: nowMs() - startedAt,
                    };
                } catch (err) {
                    if (err && typeof err === "object") {
                        err.elapsedMs = nowMs() - startedAt;
                    }
                    throw err;
                }
            }

            function apiErrorMessage(data, fallback) {
                if (data && data.error) {
                    if (typeof data.error === "string") return data.error;
                    if (typeof data.error.message === "string") {
                        return data.error.message;
                    }
                }
                return fallback;
            }

            function renderError(containerId, err, elapsedMs) {
                const el = document.getElementById(containerId);
                el.className = "result-box error";
                if (typeof elapsedMs !== "number") {
                    el.textContent = err.message || err;
                    return;
                }

                el.innerHTML = "";
                el.appendChild(
                    createMetaRow([
                        {
                            label: "Request Time",
                            value: formatElapsedMs(elapsedMs),
                        },
                    ]),
                );

                const message = document.createElement("div");
                message.className = "error-message";
                message.textContent = err.message || err;
                el.appendChild(message);
            }

            function normalizeTokenId(value, position) {
                const token = String(value).trim();
                if (!/^\d+$/.test(token)) {
                    throw new Error(
                        `Invalid token ID at position ${position}: ${token}`,
                    );
                }

                const id = Number.parseInt(token, 10);
                if (!Number.isSafeInteger(id) || id < 0) {
                    throw new Error(
                        `Invalid token ID at position ${position}: ${token}`,
                    );
                }

                return id;
            }

            function parseTokenIds(raw) {
                const trimmed = raw.trim();
                if (!trimmed) return [];

                let normalized = trimmed
                    .replace(/[［【]/g, "[")
                    .replace(/[］】]/g, "]")
                    .replace(/[，、；;]/g, ",");

                if (normalized.startsWith("[") && normalized.endsWith("]")) {
                    try {
                        const parsed = JSON.parse(normalized);
                        if (!Array.isArray(parsed)) {
                            throw new Error("Token IDs must be a JSON array.");
                        }
                        return parsed.map((value, index) =>
                            normalizeTokenId(value, index + 1),
                        );
                    } catch (err) {
                        const inner = normalized.slice(1, -1).trim();
                        if (!inner) return [];
                        normalized = inner;
                    }
                }

                const parts = normalized
                    .split(/[\s,]+/)
                    .map((part) => part.trim())
                    .filter((part) => part !== "");

                return parts.map((part, index) =>
                    normalizeTokenId(part, index + 1),
                );
            }

            function renderDecodedText(containerId, text, elapsedMs) {
                const el = document.getElementById(containerId);
                el.className = "result-box success";
                el.innerHTML = "";
                el.appendChild(
                    createMetaRow([
                        {
                            label: "Request Time",
                            value: formatElapsedMs(elapsedMs),
                        },
                    ]),
                );

                const content = document.createElement("div");
                content.className = "text-result";
                content.textContent = text;
                el.appendChild(content);
            }

            function renderCountResult(containerId, count, elapsedMs) {
                const el = document.getElementById(containerId);
                el.className = "result-box success";
                el.innerHTML = "";
                el.appendChild(
                    createMetaRow([
                        {
                            label: "Request Time",
                            value: formatElapsedMs(elapsedMs),
                        },
                    ]),
                );

                const content = document.createElement("div");
                content.className = "count-result-content";

                const countDisplay = document.createElement("span");
                countDisplay.className = "count-display";
                countDisplay.textContent = `${count}`;

                const countUnit = document.createElement("span");
                countUnit.className = "count-unit";
                countUnit.textContent = count === 1 ? "token" : "tokens";

                content.appendChild(countDisplay);
                content.appendChild(countUnit);
                el.appendChild(content);
            }

            function parseChatCompletionsInput(raw) {
                const trimmed = raw.trim();
                if (!trimmed) {
                    throw new Error("Please enter chat completions JSON.");
                }

                let parsed;
                try {
                    parsed = JSON.parse(trimmed);
                } catch (err) {
                    throw new Error(`Invalid JSON: ${err.message}`);
                }

                if (Array.isArray(parsed)) {
                    return { messages: parsed };
                }

                if (!parsed || typeof parsed !== "object") {
                    throw new Error(
                        "Chat completions input must be an object or message array.",
                    );
                }

                if (!Array.isArray(parsed.messages)) {
                    throw new Error("Chat completions input must include messages.");
                }

                return parsed;
            }

            function formatTemplateSource(source) {
                if (source === "tokenizer_config") return "tokenizer_config";
                if (source === "jinja_file") return "jinja_file";
                return source || "unknown";
            }

            function formatTemplateName(renderData) {
                return (
                    renderData.template_name ||
                    formatTemplateSource(renderData.template_source)
                );
            }

            const TOKEN_TABLE_ROW_HEIGHT = 36;
            const TOKEN_TABLE_BUFFER_ROWS = 12;

            function displayTokenText(text) {
                if (text === "") {
                    return { value: "(empty)", empty: true };
                }
                if (/^\s+$/.test(text)) {
                    return { value: JSON.stringify(text), empty: false };
                }
                return { value: text, empty: false };
            }

            function appendTokenTableSpacer(tbody, rowCount) {
                if (rowCount <= 0) return;

                const row = document.createElement("tr");
                row.className = "token-table-spacer";

                const cell = document.createElement("td");
                cell.colSpan = 3;
                cell.style.height = `${rowCount * TOKEN_TABLE_ROW_HEIGHT}px`;

                row.appendChild(cell);
                tbody.appendChild(row);
            }

            function appendTokenTableRow(tbody, ids, tokens, index) {
                const row = document.createElement("tr");

                const indexCell = document.createElement("td");
                indexCell.className = "token-table-index";
                indexCell.textContent = `${index}`;

                const idCell = document.createElement("td");
                idCell.className = "token-table-id";
                idCell.textContent = `${ids[index]}`;

                const textCell = document.createElement("td");
                const tokenText =
                    typeof tokens[index] === "string" ? tokens[index] : "";
                const display = displayTokenText(tokenText);
                textCell.className = "token-table-text";
                if (display.empty) textCell.classList.add("token-table-empty");
                textCell.textContent = display.value;
                textCell.title = tokenText;

                row.appendChild(indexCell);
                row.appendChild(idCell);
                row.appendChild(textCell);
                tbody.appendChild(row);
            }

            function renderTokenTable(ids, tokens = []) {
                const wrapper = document.createElement("div");
                wrapper.className = "token-table-wrapper";

                const table = document.createElement("table");
                table.className = "token-table";

                const colgroup = document.createElement("colgroup");
                ["6rem", "8rem", "auto"].forEach((width) => {
                    const col = document.createElement("col");
                    col.style.width = width;
                    colgroup.appendChild(col);
                });

                const thead = document.createElement("thead");
                const headerRow = document.createElement("tr");
                ["Index", "Token ID", "Text"].forEach((label) => {
                    const th = document.createElement("th");
                    th.textContent = label;
                    headerRow.appendChild(th);
                });
                thead.appendChild(headerRow);

                const tbody = document.createElement("tbody");
                let renderedStart = -1;
                let renderedEnd = -1;
                let pendingFrame = 0;

                function renderVisibleRows() {
                    pendingFrame = 0;
                    const total = ids.length;
                    const viewportHeight =
                        wrapper.clientHeight || TOKEN_TABLE_ROW_HEIGHT * 10;
                    const viewportRows = Math.ceil(
                        viewportHeight / TOKEN_TABLE_ROW_HEIGHT,
                    );
                    const start = Math.max(
                        0,
                        Math.floor(wrapper.scrollTop / TOKEN_TABLE_ROW_HEIGHT) -
                            TOKEN_TABLE_BUFFER_ROWS,
                    );
                    const end = Math.min(
                        total,
                        start + viewportRows + TOKEN_TABLE_BUFFER_ROWS * 2,
                    );

                    if (start === renderedStart && end === renderedEnd) return;
                    renderedStart = start;
                    renderedEnd = end;

                    tbody.replaceChildren();
                    appendTokenTableSpacer(tbody, start);
                    for (let index = start; index < end; index += 1) {
                        appendTokenTableRow(tbody, ids, tokens, index);
                    }
                    appendTokenTableSpacer(tbody, total - end);
                }

                wrapper.addEventListener(
                    "scroll",
                    () => {
                        if (pendingFrame) return;
                        pendingFrame = requestAnimationFrame(renderVisibleRows);
                    },
                    { passive: true },
                );

                table.appendChild(colgroup);
                table.appendChild(thead);
                table.appendChild(tbody);
                wrapper.appendChild(table);
                renderVisibleRows();
                requestAnimationFrame(renderVisibleRows);
                return wrapper;
            }

            function renderChatResult(
                renderData,
                ids,
                tokens,
                renderElapsedMs,
                encodeElapsedMs,
            ) {
                const el = document.getElementById("render-result");
                el.className = "result-box success";
                el.innerHTML = "";

                const header = document.createElement("div");
                header.className = "result-header";

                const headerInfo = document.createElement("div");
                headerInfo.className = "result-header-info";

                const countLabel = document.createElement("span");
                countLabel.className = "token-count-label";
                countLabel.textContent = "Token Count";

                const countInfo = document.createElement("span");
                countInfo.className = "token-count";
                countInfo.textContent = `${renderData.count}`;

                headerInfo.appendChild(countLabel);
                headerInfo.appendChild(countInfo);
                headerInfo.appendChild(
                    createMetaRow([
                        {
                            label: "Template",
                            value: formatTemplateName(renderData),
                        },
                        {
                            label: "Render",
                            value: formatElapsedMs(renderElapsedMs),
                        },
                        {
                            label: "Encode",
                            value: formatElapsedMs(encodeElapsedMs),
                        },
                    ]),
                );

                const copyBtn = document.createElement("button");
                copyBtn.className = "copy-btn";
                copyBtn.textContent = "Copy";
                copyBtn.onclick = (e) => {
                    e.stopPropagation();
                    navigator.clipboard
                        .writeText(renderData.text)
                        .then(() => {
                            const originalText = copyBtn.textContent;
                            copyBtn.textContent = "Copied!";
                            copyBtn.classList.add("copied");
                            setTimeout(() => {
                                copyBtn.textContent = originalText;
                                copyBtn.classList.remove("copied");
                            }, 2000);
                        })
                        .catch(() => {
                            alert("Failed to copy");
                        });
                };

                header.appendChild(headerInfo);
                header.appendChild(copyBtn);
                el.appendChild(header);

                const textLabel = document.createElement("div");
                textLabel.className = "section-label";
                textLabel.textContent = "Rendered Text";
                el.appendChild(textLabel);

                const renderedText = document.createElement("code");
                renderedText.className = "rendered-code";
                renderedText.textContent = renderData.text;
                el.appendChild(renderedText);

                const tableLabel = document.createElement("div");
                tableLabel.className = "section-label";
                tableLabel.textContent = "Token List";
                el.appendChild(tableLabel);
                el.appendChild(renderTokenTable(ids, tokens));
            }

            async function handleRender() {
                if (!currentModel || !selectedModelInfo()?.has_chat_template) return;

                let payload;
                try {
                    payload = parseChatCompletionsInput(
                        document.getElementById("render-input").value,
                    );
                } catch (err) {
                    return renderError("render-result", err);
                }

                renderLoading("render-result");
                try {
                    const { res, data, elapsedMs } = await timedJsonFetch(
                        "/v1/chat/render",
                        {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                ...payload,
                                model: currentModel,
                            }),
                        },
                    );

                    if (!res.ok) {
                        const err = new Error(
                            apiErrorMessage(data, "Render failed"),
                        );
                        err.elapsedMs = elapsedMs;
                        throw err;
                    }

                    const encoded = await timedJsonFetch("/v1/token/encode", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            model: currentModel,
                            text: data.text,
                        }),
                    });

                    if (!encoded.res.ok) {
                        const err = new Error(
                            apiErrorMessage(encoded.data, "Encode failed"),
                        );
                        err.elapsedMs = elapsedMs + encoded.elapsedMs;
                        throw err;
                    }

                    renderChatResult(
                        data,
                        encoded.data.ids,
                        encoded.data.tokens || [],
                        elapsedMs,
                        encoded.elapsedMs,
                    );
                } catch (err) {
                    renderError("render-result", err, err.elapsedMs);
                }
            }

            async function handleEncode() {
                const text = document.getElementById("encode-input").value;
                if (!text || !currentModel) return;

                renderLoading("encode-result");
                try {
                    const { res, data, elapsedMs } = await timedJsonFetch(
                        "/v1/token/encode",
                        {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ model: currentModel, text }),
                        },
                    );
                    if (!res.ok) {
                        const err = new Error(
                            apiErrorMessage(data, "Encode failed"),
                        );
                        err.elapsedMs = elapsedMs;
                        throw err;
                    }

                    const el = document.getElementById("encode-result");
                    el.className = "result-box success";
                    el.innerHTML = "";

                    // Header with token count and copy button
                    const header = document.createElement("div");
                    header.className = "result-header";

                    const headerInfo = document.createElement("div");
                    headerInfo.className = "result-header-info";

                    const countLabel = document.createElement("span");
                    countLabel.className = "token-count-label";
                    countLabel.textContent = "Token Count";

                    const countInfo = document.createElement("span");
                    countInfo.className = "token-count";
                    countInfo.textContent = `${data.ids.length}`;

                    headerInfo.appendChild(countLabel);
                    headerInfo.appendChild(countInfo);
                    headerInfo.appendChild(
                        createMetaRow([
                            {
                                label: "Request Time",
                                value: formatElapsedMs(elapsedMs),
                            },
                        ]),
                    );

                    const copyBtn = document.createElement("button");
                    copyBtn.className = "copy-btn";
                    copyBtn.textContent = "Copy";
                    copyBtn.onclick = (e) => {
                        e.stopPropagation();
                        const tokenStr = data.ids.join(", ");
                        navigator.clipboard.writeText(tokenStr).then(() => {
                            const originalText = copyBtn.textContent;
                            copyBtn.textContent = "Copied!";
                            copyBtn.classList.add("copied");
                            setTimeout(() => {
                                copyBtn.textContent = originalText;
                                copyBtn.classList.remove("copied");
                            }, 2000);
                        }).catch(() => {
                            alert("Failed to copy");
                        });
                    };

                    header.appendChild(headerInfo);
                    header.appendChild(copyBtn);
                    el.appendChild(header);

                    const tableLabel = document.createElement("div");
                    tableLabel.className = "section-label";
                    tableLabel.textContent = "Token List";
                    el.appendChild(tableLabel);
                    el.appendChild(renderTokenTable(data.ids, data.tokens || []));
                } catch (err) {
                    renderError("encode-result", err, err.elapsedMs);
                }
            }

            async function handleDecode() {
                const raw = document.getElementById("decode-input").value;
                if (!raw || !currentModel) return;

                let ids;
                try {
                    ids = parseTokenIds(raw);
                } catch (err) {
                    return renderError("decode-result", err);
                }

                if (ids.length === 0)
                    return renderError(
                        "decode-result",
                        "Please enter valid numbers",
                    );

                renderLoading("decode-result");
                try {
                    const { res, data, elapsedMs } = await timedJsonFetch(
                        "/v1/token/decode",
                        {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ model: currentModel, ids }),
                        },
                    );

                    if (!res.ok) {
                        const err = new Error(
                            apiErrorMessage(data, "Decode failed"),
                        );
                        err.elapsedMs = elapsedMs;
                        throw err;
                    }

                    renderDecodedText("decode-result", data.text, elapsedMs);
                } catch (err) {
                    renderError("decode-result", err, err.elapsedMs);
                }
            }

            async function handleCount() {
                const text = document.getElementById("count-input").value;
                if (!text || !currentModel) return;

                renderLoading("count-result");
                try {
                    const { res, data, elapsedMs } = await timedJsonFetch(
                        "/v1/token/count",
                        {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ model: currentModel, text }),
                        },
                    );

                    if (!res.ok) {
                        const err = new Error(
                            apiErrorMessage(data, "Count failed"),
                        );
                        err.elapsedMs = elapsedMs;
                        throw err;
                    }

                    renderCountResult("count-result", data.count, elapsedMs);
                } catch (err) {
                    renderError("count-result", err, err.elapsedMs);
                }
            }

            // Initialize
            document.addEventListener("DOMContentLoaded", fetchModels);
        </script>
    </body>
</html>
